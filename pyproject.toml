[project]
name = "llm-experiments"
version = "0.1.0"
description = "Harness for running human-in-the-loop LLM agent experiments"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.157",
    "openai-codex>=0.155.1",
    "openai-sdk>=0.1.0",
    "pydantic>=2.13.5",
]

[project.scripts]
harness = "experiments.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiments"]
